<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 154">
  <!-- The wordmark for any background, used by the README: the mark on its white tile with an edge in the brand color, as the options page shows it on light, and the name in the brand color, which reads on white and on a dark page alike. One image, because a README cannot know the reader's theme: GitHub's picture element follows the operating system, not GitHub's own theme setting. Composed from icon.svg and name.svg. -->
